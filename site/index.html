<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rifa Online</title>
    <meta
      name="description"
      content="Arma una rifa en línea, comparte el enlace por Chile y recibe la transferencia en la cuenta de quien la organiza."
    />
    <meta name="theme-color" content="#243044" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,680&family=Outfit:wght@400;500;600;700&display=swap"

    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <a class="skip" href="#contenido">Saltar al contenido</a>
    <header class="top">
      <a class="brand" href="./" data-go="home">Rifa Online</a>
      <nav class="top-nav">
        <a href="./?nueva=1" data-go="create">Armar rifa</a>
      </nav>
    </header>
    <div id="modo" class="modo" hidden></div>
    <main id="contenido"></main>
    <footer class="pie">
      <p>
        Quien publica la rifa organiza el premio, indica su cuenta y confirma la transferencia cuando la ve.
      </p>
    </footer>
    <div id="aviso" role="status"></div>
    <script src="js/config.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
